; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Mặc định chỉ build/nạp firmware chính. Env s01_openloop phải gọi rõ bằng -e.
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB

board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
; Mọi env (kế thừa env này): ghi commit, dirty, env vào src/fw_id_gen.h → dòng #fw lúc khởi động và qua UDP
; (Liam 09/11, phiên CODE; trước chỉ s06_load)
extra_scripts = pre:scripts/build_id.py

build_flags = 
    -I src/motor
    -I src/encoder
    -I src/ibus
    -I src/kinematics
    -I src/logger
    -I src/wifi
    -I src/rasp_uart
    -I src/imu
    -I src/led_buzzer
    -I src/ultrasonic
    -I src/tests
    -I src/manual_control
    -I src/controller

    ; -DTEST_MODE
    ; -DTEST_MOTOR    ; chỉ đổi dòng này
    ; -DTEST_ENCODER  ; chỉ đổi dòng này
    ; -DTEST_IBUS     ; chỉ đổi dòng này  
    ; -DTEST_KINEMATICS ; chỉ đổi dòng này
    ; -DTEST_LOGGER   ; chỉ đổi dòng này
    ; -DTEST_WIFI     ; chỉ đổi dòng này
    ; -DTEST_RASP_UART ; chỉ đổi dòng này
    ; -DTEST_IMU      ; chỉ đổi dòng này
    ; -DTEST_LED_BUZZER ; chỉ đổi dòng này
    ; -DTEST_ULTRASONIC ; chỉ đổi dòng này
    ; -DTEST_MANUAL ; chỉ đổi dòng này
    ; -DTEST_OPENLOOP ; spec S01: chạy hở kê bánh, PC điều khiển qua UART0 921600 (hil-framework tools/s01_openloop_runner.py)

; Spec S01 (kê bánh, chạy hở): nạp bằng `pio run -e s01_openloop -t upload`.
; Env riêng để không phải sửa build_flags bằng tay, nên cây làm việc vẫn sạch (meta.yaml dirty: false).
[env:s01_openloop]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DTEST_MODE
    -DTEST_OPENLOOP

; Một binary cho bàn HIL và xe (Outline QĐ 6 bậc 1, Liam chốt 31/10): env mặc định (PID) và env ladrc
; dùng cho cả hai, mỗi controller một binary. Trên bàn HIL, H7 phát iBUS vào GPIO18 (SWA bật) thay cho
; cờ bỏ qua SWA, nên env này chỉ bật được motor trên bàn khi có nhánh H7 iBUS.
[env:ladrc]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DCTRL_MODE=CTRL_ADRC

; Bài kê bánh (nhóm A-K, Q3): cờ wheels_lifted chọn bằng env, không bằng kênh RC (Liam 09/11, phiên CODE:
; "13. bằng env đi, vì giờ bạn có thể nạp code tự động được rồi mà, chọn env sẽ chính xác và nhanh hơn.",
; STATUS_CODE L55 a). RUN_WHEELS_LIFTED -> vel_ctrl_in.wheels_lifted = true (main.c): tắt ước lượng bias
; gyro trong imu_fusion.c; mọi thứ khác như env cha. Nạp env này trước lượt A-K, nạp lại env thường sau.
; Dòng #fw ghi env=wheels_lifted / ladrc_wheels_lifted, nên meta.yaml thấy được bài nào chạy env nào.
[env:wheels_lifted]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DRUN_WHEELS_LIFTED

[env:ladrc_wheels_lifted]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DCTRL_MODE=CTRL_ADRC
    -DRUN_WHEELS_LIFTED

; Env đo nghiệm thu S06 (spec S06 v3.4 mục 8; thiết kế 03_CODE/docs/2026-10-29_Thiet_ke_env_s06_load.md
; của repo luận văn). Chỉ nạp ESP32 rời bàn HIL, không bao giờ nạp lên xe (bỏ qua SWA như hil_bench).
; PWM theo lịch thay controller, IMU 100 Hz, đọc encoder 1 ms, sự kiện UDP tới Pi cổng 5007, lệnh
; START/STOP qua UDP cổng 5011. IP Pi 192.168.1.76 (Setup RPi5); ESP32 và Pi phải cùng mạng (Q3, kiểm ở bàn).
[env:s06_load]
extends = env:esp32-s3-devkitc-1
extra_scripts = pre:scripts/build_id.py
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DS06_LOAD
    -DHIL_BYPASS_MOTOR_ENABLE
    -DTRAJ_UART_ONLY
    -DIMU_REPORT_PERIOD_US=10000UL
    '-DLOGGER_PC_IP="192.168.1.76"'

; Đo nhiễu IMU (BNO085 thô) ở 2 tần số report (Outline V7.4 K1, Liam 22/10):
;   `pio run -e imu_log_20 -t upload`  (50 ms)  |  `pio run -e imu_log_100 -t upload`  (10 ms)
; PC chạy hil-framework tools/imu_capture.py --rate 20 / --rate 100. Mỗi report in một dòng.
[env:imu_log_20]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DTEST_MODE
    -DTEST_IMU_LOG
    -DIMU_REPORT_PERIOD_US=50000UL

[env:imu_log_100]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DTEST_MODE
    -DTEST_IMU_LOG
    -DIMU_REPORT_PERIOD_US=10000UL

; Bản ghi SPI ESP32 ↔ BNO085 (QĐ 26, G0 v1 §7; 28/10): kịch bản S1/S2, S3, S4, S5 tự chạy,
; in ra serial USB sau mỗi kịch bản. Cùng env cho ESP32 trên xe (chip thật) và ESP32 rời
; của bàn HIL (H7 giả lập). PC: python tools/bno_trace_capture.py --port COMx --board car|hil --out ...
; -DBNO_TRACE bật các móc trong thư viện esp32_BNO08x; firmware chính không có.
; 100 Hz: chỉ 20 s khởi động vì RAM (không PSRAM), hai phía chạy cùng env nên vẫn so được.
[env:imu_trace_20]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DTEST_MODE
    -DTEST_IMU_TRACE
    -DBNO_TRACE
    -DIMU_REPORT_PERIOD_US=50000UL
    -DTRACE_BOOT_S=60

[env:imu_trace_100]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DTEST_MODE
    -DTEST_IMU_TRACE
    -DBNO_TRACE
    -DIMU_REPORT_PERIOD_US=10000UL
    -DTRACE_BOOT_S=20

; Kiểm độc lập tần số encoder H7 phát (bug H7-ENC-PI, 22/10): đếm xung thô PCNT mỗi 10 s.
;   `pio run -e enc_count -t upload`, rồi `pio device monitor`; RPi5 chạy run_hil.py --fixed-omega ...
[env:enc_count]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DTEST_MODE
    -DTEST_ENC_COUNT

; Kiểm H7 PWMCapture (bug H7-TIM17-PIN, H7-TIM15-ARM, H7-PWM-LEVEL, 22/10): giữ lệnh PWM cố định theo bảng.
;   `pio run -e pwm_hold -t upload` trên ESP32 rời; so dòng "PWM:" của H7 với bảng dự đoán.
[env:pwm_hold]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DTEST_MODE
    -DTEST_PWM_HOLD

; Như pwm_hold, thêm tăng dòng ra (drive strength) GPIO46 lên mức 3 (27/10, Liam duyệt ở phiên CODE):
;   H7 chỉ đọc sai tín hiệu từ GPIO46 (PWM_CAPTURE run01-run05). Từ 27/10 motor_init() đã đặt GPIO46 mức 3 cho mọi env
;   (run06, run07 xác nhận), nên env này nay giống pwm_hold; giữ lại để đối chiếu các log cũ.
;   `pio run -e pwm_hold_drv46 -t upload` trên ESP32 rời.
[env:pwm_hold_drv46]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DTEST_MODE
    -DTEST_PWM_HOLD
    -DPWM_HOLD_DRV46

; Kiểm relay UART H7 -> ESP32 (PD5 -> GPIO15 + GND; Liam 27/10): bộ nhận quỹ đạo thật, in số gói đúng/sai mỗi giây.
;   `pio run -e relay_check -t upload` trên ESP32 rời; RPi5 chạy run_hil.py có quỹ đạo (--traj line ...).
[env:relay_check]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DTEST_MODE
    -DTEST_RELAY
