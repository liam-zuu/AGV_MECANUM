; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Mặc định chỉ build/nạp firmware chính. Env s01_openloop phải gọi rõ bằng -e.
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB

board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv

build_flags = 
    -I src/motor
    -I src/encoder
    -I src/ibus
    -I src/kinematics
    -I src/logger
    -I src/wifi
    -I src/rasp_uart
    -I src/imu
    -I src/led_buzzer
    -I src/ultrasonic
    -I src/tests
    -I src/manual_control
    -I src/controller

    ; -DTEST_MODE
    ; -DTEST_MOTOR    ; chỉ đổi dòng này
    ; -DTEST_ENCODER  ; chỉ đổi dòng này
    ; -DTEST_IBUS     ; chỉ đổi dòng này  
    ; -DTEST_KINEMATICS ; chỉ đổi dòng này
    ; -DTEST_LOGGER   ; chỉ đổi dòng này
    ; -DTEST_WIFI     ; chỉ đổi dòng này
    ; -DTEST_RASP_UART ; chỉ đổi dòng này
    ; -DTEST_IMU      ; chỉ đổi dòng này
    ; -DTEST_LED_BUZZER ; chỉ đổi dòng này
    ; -DTEST_ULTRASONIC ; chỉ đổi dòng này
    ; -DTEST_MANUAL ; chỉ đổi dòng này
    ; -DTEST_OPENLOOP ; spec S01: chạy hở kê bánh, PC điều khiển qua UART0 921600 (hil-framework tools/s01_openloop_runner.py)

; Spec S01 (kê bánh, chạy hở): nạp bằng `pio run -e s01_openloop -t upload`.
; Env riêng để không phải sửa build_flags bằng tay, nên cây làm việc vẫn sạch (meta.yaml dirty: false).
[env:s01_openloop]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DTEST_MODE
    -DTEST_OPENLOOP

; Bàn HIL (ESP32 rời, không có bộ thu RC): firmware chính + bỏ qua công tắc SWA (motor luôn enable).
; Firmware xe dùng env mặc định: SWA bật/tắt motor, mất sóng RC thì tắt (spec controller-IMU v2 §7b, Liam 27/10).
;   `pio run -e hil_bench -t upload` trên ESP32 rời.
[env:hil_bench]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DHIL_BYPASS_MOTOR_ENABLE

; Đo nhiễu IMU (BNO085 thô) ở 2 tần số report (Outline V7.4 K1, Liam 22/10):
;   `pio run -e imu_log_20 -t upload`  (50 ms)  |  `pio run -e imu_log_100 -t upload`  (10 ms)
; PC chạy hil-framework tools/imu_capture.py --rate 20 / --rate 100. Mỗi report in một dòng.
[env:imu_log_20]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DTEST_MODE
    -DTEST_IMU_LOG
    -DIMU_REPORT_PERIOD_US=50000UL

[env:imu_log_100]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DTEST_MODE
    -DTEST_IMU_LOG
    -DIMU_REPORT_PERIOD_US=10000UL

; Bản ghi SPI ESP32 ↔ BNO085 (QĐ 26, G0 v1 §7; 28/10): kịch bản S1/S2, S3, S4, S5 tự chạy,
; in ra serial USB sau mỗi kịch bản. Cùng env cho ESP32 trên xe (chip thật) và ESP32 rời
; của bàn HIL (H7 giả lập). PC: python tools/bno_trace_capture.py --port COMx --board car|hil --out ...
; -DBNO_TRACE bật các móc trong thư viện esp32_BNO08x; firmware chính không có.
; 100 Hz: chỉ 20 s khởi động vì RAM (không PSRAM), hai phía chạy cùng env nên vẫn so được.
[env:imu_trace_20]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DTEST_MODE
    -DTEST_IMU_TRACE
    -DBNO_TRACE
    -DIMU_REPORT_PERIOD_US=50000UL
    -DTRACE_BOOT_S=60

[env:imu_trace_100]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DTEST_MODE
    -DTEST_IMU_TRACE
    -DBNO_TRACE
    -DIMU_REPORT_PERIOD_US=10000UL
    -DTRACE_BOOT_S=20

; Kiểm độc lập tần số encoder H7 phát (bug H7-ENC-PI, 22/10): đếm xung thô PCNT mỗi 10 s.
;   `pio run -e enc_count -t upload`, rồi `pio device monitor`; RPi5 chạy run_hil.py --fixed-omega ...
[env:enc_count]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DTEST_MODE
    -DTEST_ENC_COUNT

; Kiểm H7 PWMCapture (bug H7-TIM17-PIN, H7-TIM15-ARM, H7-PWM-LEVEL, 22/10): giữ lệnh PWM cố định theo bảng.
;   `pio run -e pwm_hold -t upload` trên ESP32 rời; so dòng "PWM:" của H7 với bảng dự đoán.
[env:pwm_hold]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DTEST_MODE
    -DTEST_PWM_HOLD

; Như pwm_hold, thêm tăng dòng ra (drive strength) GPIO46 lên mức 3 (27/10, Liam duyệt ở phiên CODE):
;   H7 chỉ đọc sai tín hiệu từ GPIO46 (PWM_CAPTURE run01-run05). Từ 27/10 motor_init() đã đặt GPIO46 mức 3 cho mọi env
;   (run06, run07 xác nhận), nên env này nay giống pwm_hold; giữ lại để đối chiếu các log cũ.
;   `pio run -e pwm_hold_drv46 -t upload` trên ESP32 rời.
[env:pwm_hold_drv46]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DTEST_MODE
    -DTEST_PWM_HOLD
    -DPWM_HOLD_DRV46

; Kiểm relay UART H7 -> ESP32 (PD5 -> GPIO15 + GND; Liam 27/10): bộ nhận quỹ đạo thật, in số gói đúng/sai mỗi giây.
;   `pio run -e relay_check -t upload` trên ESP32 rời; RPi5 chạy run_hil.py có quỹ đạo (--traj line ...).
[env:relay_check]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DTEST_MODE
    -DTEST_RELAY
