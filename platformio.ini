; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Mặc định chỉ build/nạp firmware chính. Env s01_openloop phải gọi rõ bằng -e.
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB

board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv

build_flags = 
    -I src/motor
    -I src/encoder
    -I src/ibus
    -I src/kinematics
    -I src/logger
    -I src/wifi
    -I src/rasp_uart
    -I src/imu
    -I src/led_buzzer
    -I src/ultrasonic
    -I src/tests
    -I src/manual_control
    -I src/controller

    ; -DTEST_MODE
    ; -DTEST_MOTOR    ; chỉ đổi dòng này
    ; -DTEST_ENCODER  ; chỉ đổi dòng này
    ; -DTEST_IBUS     ; chỉ đổi dòng này  
    ; -DTEST_KINEMATICS ; chỉ đổi dòng này
    ; -DTEST_LOGGER   ; chỉ đổi dòng này
    ; -DTEST_WIFI     ; chỉ đổi dòng này
    ; -DTEST_RASP_UART ; chỉ đổi dòng này
    ; -DTEST_IMU      ; chỉ đổi dòng này
    ; -DTEST_LED_BUZZER ; chỉ đổi dòng này
    ; -DTEST_ULTRASONIC ; chỉ đổi dòng này
    ; -DTEST_MANUAL ; chỉ đổi dòng này
    ; -DTEST_OPENLOOP ; spec S01: chạy hở kê bánh, PC điều khiển qua UART0 921600 (hil-framework tools/s01_openloop_runner.py)

; Spec S01 (kê bánh, chạy hở): nạp bằng `pio run -e s01_openloop -t upload`.
; Env riêng để không phải sửa build_flags bằng tay, nên cây làm việc vẫn sạch (meta.yaml dirty: false).
[env:s01_openloop]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DTEST_MODE
    -DTEST_OPENLOOP

; Đo nhiễu IMU (BNO085 thô): nạp bằng `pio run -e imu_log -t upload`; PC chạy hil-framework tools/imu_capture.py.
[env:imu_log]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DTEST_MODE
    -DTEST_IMU_LOG
